[project]
name = "pl-swmm"
version = "0.1.0"
description = "Browser workspace for EPA SWMM 5.2.4 models and GIS"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "swmm-toolkit==0.17.0",
  "pyproj==3.8.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
